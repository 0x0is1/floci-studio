<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Floci Studio - Service Notice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #09090b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; user-select: none; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 32px; max-width: 480px; width: 90%; text-align: center; }
    .logo { width: 56px; height: 56px; margin: 0 auto 16px; display: block; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #fafafa; }
    p { font-size: 13px; color: #a1a1aa; line-height: 1.5; margin-bottom: 20px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 500; background: #27272a; color: #d4d4d8; margin-bottom: 16px; border: 1px solid #3f3f46; }
    .btn { background: #e11d48; color: #ffffff; border: none; border-radius: 6px; padding: 10px 20px; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #27272a; color: #e4e4e7; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.ico" class="logo" alt="Floci" />
    <span id="badge" class="badge">Connection Notice</span>
    <h1 id="title">Service Temporarily Unavailable</h1>
    <p id="desc">The Floci Studio interface is not reachable on localhost:3000. This may happen if the background server is still starting or was stopped.</p>
    <div>
      <button class="btn" onclick="window.location.href='http://localhost:3000'">Retry Connection</button>
      <button class="btn btn-secondary" onclick="if (window.electronAPI) window.electronAPI.restartChecks()">Restart Checks</button>
    </div>
  </div>
</body>
</html>
